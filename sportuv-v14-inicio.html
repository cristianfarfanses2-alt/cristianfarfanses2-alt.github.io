<!doctype html>
<html lang="es">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f5a">
<title>SPORTUV</title>
<style>
:root{--blue:#123f5a;--blue2:#0d334a;--bg:#f4f7f9;--text:#17242d;--muted:#6b7a86;--line:#d9e2e8;--warn:#fff4e5;--warnb:#efbd60}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#dfe7ec;color:var(--text)}
button,input{font:inherit}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg)}
.screen{min-height:100vh}
.login{background:#fff;display:flex;flex-direction:column;justify-content:center;padding:34px 28px}
.logo{font-size:48px;font-weight:800;text-align:center;color:var(--blue)}
.tag{text-align:center;font-size:20px;margin:10px 0 34px}
label{display:block;font-weight:700;margin:14px 0 7px}
.field{width:100%;padding:15px;border:1px solid #ccd8df;border-radius:13px;background:#fff;font-size:16px}
.btn{width:100%;border:0;border-radius:14px;padding:15px 16px;background:var(--blue);color:#fff;font-weight:800;margin-top:18px}
.btn:disabled{opacity:.45}
.error{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fff0f0;color:#a13a3a}
.small{font-size:13px;color:var(--muted)}
header{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{color:var(--blue);letter-spacing:.08em}
.icon{width:42px;height:42px;border:0;border-radius:13px;background:#edf3f6;color:var(--blue);font-size:20px}
.logoutTextBtn{height:42px;border:0;border-radius:13px;background:#edf3f6;color:var(--blue);font-size:12px;font-weight:800;padding:0 12px;white-space:nowrap;cursor:pointer}
main{padding:22px}
h1{font-size:27px;margin:4px 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{position:relative;height:190px;border-radius:20px;overflow:hidden;margin:15px 0;background:#31434e;box-shadow:0 12px 30px #0002}
.card img,.hero img{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.06) brightness(.9)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0d334a12 5%,#07151f2b 45%,#07151fd9 100%)}
.cardText{position:absolute;left:18px;right:18px;bottom:15px;color:#fff;z-index:2}
.cardText h2{margin:0 0 5px}
.pill{display:inline-block;margin-top:8px;padding:8px 11px;border-radius:999px;background:#fff;color:var(--blue);font-weight:700;font-size:13px}
.referenceTag{display:inline-block;margin-bottom:7px;padding:5px 8px;border-radius:999px;background:#ffffffd9;color:var(--blue);font-size:11px;font-weight:800}
.sportLocationCard{background:#fff;border-radius:18px;padding:14px;margin:14px 0;box-shadow:0 8px 24px #18364612}
.sportLocationCard img{width:100%;height:150px;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block;margin-top:10px}
.sportLocationCard .mapCredit{font-size:11px;color:var(--muted);margin-top:7px}
.prototypeNotice{background:#fff8dd;border:1px solid #ead69b;border-radius:15px;padding:12px 14px;margin:12px 0 16px;color:#634d05;font-size:13px;line-height:1.45}
.prototypeNotice b{display:block;margin-bottom:3px}
.gymInfoCard{background:#fff;border-radius:18px;padding:14px;margin:14px 0 18px;box-shadow:0 8px 24px #18364612}
.gymInfoCard p{margin:7px 0 0;color:#40515c;line-height:1.45}
.gymInfoCard img{width:100%;height:150px;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block;margin-top:10px}
.gymInfoCard .mapCredit{font-size:11px;color:var(--muted);margin-top:7px}
.playerListCard{background:#fff;border-radius:18px;padding:15px;margin:14px 0;box-shadow:0 8px 24px #18364612}
.playerListCard h3{margin:0 0 5px;font-size:18px}
.playerList{display:grid;gap:8px;margin-top:11px}
.playerRow{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#f4f7f9;border-radius:12px}
.playerAvatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e5eef3;color:var(--blue);font-weight:900;font-size:12px;flex:0 0 30px}
.playerEmpty{padding:11px;background:#f4f7f9;border-radius:12px;color:var(--muted);font-size:13px}
.cancelHint{background:#eef5f8;border:1px solid #d5e3ea;border-radius:13px;padding:11px 12px;margin:12px 0 10px;color:#40515c;font-size:12px;line-height:1.45}
.cancelHint b{color:var(--blue)}
.aboutFooter{margin-top:28px;padding:26px 22px 30px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;text-align:center;cursor:pointer}
.aboutFooter h2{margin:0 0 8px;font-size:23px}
.aboutFooter p{margin:0 auto;max-width:360px;color:#eaf2f6;line-height:1.5}
.aboutFooter .pill{margin-top:14px}
.aboutHero{background:linear-gradient(145deg,var(--blue),#1c5e7f);color:#fff;border-radius:22px;padding:24px 20px;margin-bottom:16px}
.aboutHero .aboutLogo{font-size:35px;font-weight:900;letter-spacing:.06em;margin-bottom:8px}
.aboutSection{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #18364612}
.aboutSection h2{margin:0 0 9px;color:var(--blue);font-size:20px}
.aboutSection p{margin:0;color:#40515c;line-height:1.58}
.aboutPoint{display:flex;gap:12px;align-items:flex-start;margin-top:13px}
.aboutPoint .aboutEmoji{font-size:25px;line-height:1}
.aboutPoint b{display:block;margin-bottom:3px;color:var(--text)}
.hero{height:220px;margin:-22px -22px 18px;position:relative;overflow:hidden;background:#31434e}
.hero h1{position:absolute;left:20px;right:20px;bottom:18px;color:#fff;z-index:2}
.panel{background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 24px #18364612}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.day,.slot{padding:12px 8px;border:1px solid #d6e0e6;background:#fff;border-radius:12px;text-align:center}
.selected{background:var(--blue);color:#fff;border-color:var(--blue)}
.done{text-align:center;padding-top:38px}
.tick{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:#e2f5ea;color:#26905f;font-size:38px}
.summary{background:#fff;border-radius:16px;padding:14px;margin:20px 0;text-align:left}
.summaryRow{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px dashed #ddd}
.summaryRow:last-child{border-bottom:0}
.info{background:#fff;border-radius:18px;padding:16px;margin:16px 0;text-align:left;box-shadow:0 8px 24px #18364612}
.warning{background:var(--warn);border:1px solid var(--warnb);border-radius:16px;padding:14px 16px;margin:18px 0;text-align:left;color:#744700}
.warning b{display:block;margin-bottom:5px}
.qrWrap{margin:20px 0;text-align:left}
.qrGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qrCard{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 8px 24px #18364612}
.qrCard h3{font-size:16px;margin:0 0 9px}
.qrCard img{width:100%;max-width:150px;aspect-ratio:1/1;object-fit:contain;background:#fff}
.historyTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.historyTab{border:0;border-radius:12px;padding:10px 8px;font-weight:800;background:#eef3f6;color:var(--blue)}
.historyTab.active{background:var(--blue);color:#fff}
.serviceIcon{font-size:22px;line-height:1;margin-right:8px}
.historyTitle{display:flex;align-items:center}
.roomGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.roomOcc{background:#f4f7f9;border-radius:12px;padding:10px;font-size:13px}
.roomOcc.full{background:#fff1f1;color:#8e3131}
.historyCard{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 8px 24px #18364612}
.historyTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}
.status.active{background:#e2f5ea;color:#26734f}
.status.cancelled{background:#f3f4f5;color:#6b7280}
.miniBtn{border:0;border-radius:10px;padding:9px 11px;font-weight:800;background:#eef3f6;color:var(--blue)}
.miniBtn.danger{background:#fff0f0;color:#a13a3a}
.cap{font-size:12px;color:var(--muted);margin-top:4px}
.slotFull{opacity:.45;text-decoration:line-through}
.version{text-align:center;margin-top:14px}
@media(min-width:700px){body{padding:20px}#app{border-radius:28px;overflow:hidden;box-shadow:0 0 35px #0002}}
</style>
</head>

        var data = null;
        try{ data = textBody ? JSON.parse(textBody) : null; }catch(e){ data = textBody; }

        if(res.ok) return data;

        var code = data && data.code ? String(data.code) : "";
        var message = "";
        if(data && data.message) message = data.message;
        else if(typeof data==="string") message = data;
        else message = "Error " + res.status;

        lastError = new Error((code ? code+" · " : "") + message);

        var backendStarting = (res.status===404 && code==="PGRST202") || res.status===502 || res.status===503 || res.status===504;
        if(backendStarting && attempt<3){
          await wait(1200*(attempt+1));
          continue;
        }
        if(backendStarting){
          throw new Error("BACKEND_STARTING · "+message);
        }
        throw lastError;
      }catch(e){
        lastError=e;
        if(String(e && e.message || "").indexOf("BACKEND_STARTING")===0) throw e;
        if(attempt<3){
          await wait(1200*(attempt+1));
          continue;
        }
        throw lastError;
      }
    }
    throw lastError || new Error("No fue posible conectar con SPORTUV.");
  }

  function showConfirmationToast(){
    var old=document.getElementById("sportuvToast");
    if(old) old.remove();
    var toast=document.createElement("div");
    toast.id="sportuvToast";
    toast.textContent="Tu reserva ya ha sido confirmada";
    toast.style.position="fixed";
    toast.style.left="50%";
    toast.style.bottom="24px";
    toast.style.transform="translateX(-50%)";
    toast.style.zIndex="9999";
    toast.style.background="#123f5a";
    toast.style.color="#fff";
    toast.style.padding="13px 18px";
    toast.style.borderRadius="14px";
    toast.style.boxShadow="0 10px 28px #0004";
    toast.style.fontWeight="800";
    toast.style.width="calc(100% - 40px)";
    toast.style.maxWidth="390px";
    toast.style.textAlign="center";
    document.body.appendChild(toast);
    setTimeout(function(){ if(toast && toast.parentNode) toast.remove(); },4500);
  }

  function requestNotificationPermission(){
    if(!("Notification" in window)) return Promise.resolve("unsupported");
    if(Notification.permission==="granted") return Promise.resolve("granted");
    if(Notification.permission==="denied") return Promise.resolve("denied");
    try{
      return Notification.requestPermission();
    }catch(e){
      return Promise.resolve("unsupported");
    }
  }

  function sendReservationNotification(booking){
    showConfirmationToast();
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    try{
      new Notification("SPORTUV",{
        body:"Tu reserva ya ha sido confirmada",
        tag:booking && booking.id ? booking.id : "sportuv-confirmada"
      });
    }catch(e){}
  }

  async function loadProfessionalAvailability(service,dayKey){
    if(!dayKey || (service!=="nut" && service!=="psi")) return;
    var key=service+"|"+dayKey;
    try{
      var rows=await rpc("sportuv_service_availability",{p_service:service,p_booking_date:dayKey});
      var map={};
      (rows||[]).forEach(function(r){
        map[String(r.booking_time).slice(0,5)]={
          count:Number(r.available_professionals||0),
          names:r.professional_names||""
        };
      });
      state.professionalAvailability[key]=map;
      if(state.view==="booking" && state.service===service && state.day===dayKey) renderBooking();
    }catch(e){}
  }

  function isSport(service){
    return service==="football" || service==="basketball" || service==="volleyball";
  }

  function sportCapacity(service){
    return service==="football" ? 12 : service==="basketball" ? 10 : service==="volleyball" ? 12 : 0;
  }

  function sportTime(service){
    return service==="football" ? "18:00" : service==="basketball" ? "15:00" : service==="volleyball" ? "13:00" : "";
  }

  async function loadSportsAvailability(dayKey){
    if(!dayKey) return;
    try{
      var rows=await rpc("sportuv_sports_availability",{p_booking_date:dayKey});
      var map={};
      (rows||[]).forEach(function(r){
        map[r.service]={
          capacity:Number(r.capacity||0),
          booked:Number(r.booked||0),
          remaining:Number(r.remaining||0),
          full:!!r.is_full
        };
      });
      state.sportsAvailability[dayKey]=map;
      if(state.view==="booking" && isSport(state.service) && state.day===dayKey){
        var info=map[state.service];
        if(info && info.full) state.time=null;
        renderBooking();
      }
    }catch(e){}
  }

  async function loadSportPlayers(service,dayKey){
    if(!dayKey || !isSport(service)) return;
    var key=service+"|"+dayKey;
    try{
      var rows=await rpc("sportuv_sport_players",{p_service:service,p_booking_date:dayKey});
      state.sportPlayers[key]=(rows||[]).map(function(r){
        return {
          name:r.player_name||"Jugador/a",
          time:String(r.booking_time||"").slice(0,5)
        };
      });
      if(state.view==="booking" && state.service===service && state.day===dayKey) renderBooking();
    }catch(e){}
  }

  function sportPlayersPanel(){
    if(!isSport(state.service) || !state.day) return "";
    var key=state.service+"|"+state.day;
    var players=state.sportPlayers[key];
    if(!players){
      return '<div class="playerListCard"><h3>👥 Jugadores inscritos</h3><div class="playerEmpty">Consultando jugadores inscritos…</div></div>';
    }
    var html='<div class="playerListCard"><h3>👥 Jugadores inscritos</h3><p class="small" style="margin:0;color:var(--muted)">Lista del partido seleccionado. En esta app de prueba los nombres ingresados deben ser ficticios.</p><div class="playerList">';
    if(!players.length){
      html+='<div class="playerEmpty">Aún no hay jugadores inscritos en este partido.</div>';
    }else{
      players.forEach(function(p,i){
        var initial=String(p.name||"J").trim().charAt(0).toUpperCase()||"J";
        html+='<div class="playerRow"><span class="playerAvatar">'+esc(initial)+'</span><div><b>'+(i+1)+'. '+esc(p.name)+'</b>'+(p.time?'<div class="small">'+esc(p.time)+' hrs</div>':'')+'</div></div>';
      });
    }
    html+='</div></div>';
    return html;

  async function loadGymAvailability(dayKey){
    if(!dayKey) return;
    try{
      var rows = await rpc("sportuv_gym_availability_v2",{p_booking_date:dayKey});
      var map={};
      (rows||[]).forEach(function(r){
        map[String(r.booking_time).slice(0,5)] = {
          active:Number(r.active_bookings||0),
          remaining:Number(r.remaining_slots||0),
          waiting:Number(r.waiting_count||0)
        };
      });
      state.gymAvailability[dayKey]=map;
      if(state.view==="booking" && state.service==="gym" && state.day===dayKey) renderBooking();
    }catch(e){}
  }

  async function loadHistory(){
    if(!state.user) return;
    state.historyLoading=true;
    if(state.view==="history") renderHistory();
    try{
      var results=await Promise.all([
        rpc("sportuv_user_history",{p_email:state.user}),
        rpc("sportuv_user_waitlist",{p_email:state.user})
      ]);
      state.history=results[0]||[];
      state.waitlist=results[1]||[];
    }catch(e){
      state.history=[];
      state.waitlist=[];
    }finally{
      state.historyLoading=false;
      if(state.view==="history") renderHistory();
    }
  }

  async function cancelReservation(code){
    if(!confirm("¿Cancelar esta reserva? El cupo quedará disponible nuevamente.")) return;
    try{
      var ok = await rpc("sportuv_cancel_reservation",{p_email:state.user,p_booking_code:code});
      if(!ok) throw new Error("No se encontró una reserva activa.");
      await loadHistory();
      state.gymAvailability={};
      alert("Reserva cancelada. El cupo quedó disponible nuevamente.");
    }catch(e){
      var msg=e.message||"";
      if(msg.indexOf("CANCELLATION_WINDOW_CLOSED")!==-1){
        alert("Ya no puedes cancelar esta reserva desde la app porque falta menos de 1 hora. Debes contactar a SPORTUV.");
      }else{
        alert("No fue posible cancelar la reserva.\n\n"+msg);
      }
    }
  }

  async function joinWaitlist(dayKey,time){
    try{
      var rows=await rpc("sportuv_join_gym_waitlist",{
        p_person_name:state.name||"Sin nombre",
        p_email:state.user,
        p_booking_date:dayKey,
        p_booking_time:time
      });
      var pos=rows && rows[0] ? rows[0].queue_position : null;
      state.gymAvailability={};
      await loadGymAvailability(dayKey);
      await loadHistory();
      alert("Te uniste a la lista de espera"+(pos ? ". Posición: "+pos : "")+". Si se libera un cupo, el sistema asignará automáticamente el primero disponible.");
    }catch(e){
      var msg=e.message||"";
      if(msg.indexOf("SLOT_TOO_SOON")!==-1) alert("La lista de espera también cierra 30 minutos antes. Debes elegir el siguiente horario disponible.");
      else if(msg.indexOf("GYM_SLOT_AVAILABLE")!==-1) alert("Se liberó un cupo mientras intentabas entrar a la lista. Puedes reservar directamente.");
      else if(msg.indexOf("DUPLICATE_DAILY_BOOKING")!==-1) alert("Ya tienes una reserva de gimnasio para ese día.");
      else if(msg.indexOf("WAITLIST_DAILY_CONFLICT")!==-1) alert("Ya estás en una lista de espera del gimnasio para ese día.");
      else if(msg.indexOf("SAME_TIME_CONFLICT")!==-1) alert("Ya tienes otra reserva a esa misma hora.");
      else alert("No fue posible unirte a la lista de espera.\n\n"+msg);
    }
  }

  function getDays(service){
    var nowParts = chileNow();
    var base = nowParts.dayKey.split("-");
    var anchor = new Date(Number(base[0]),Number(base[1])-1,Number(base[2]),12,0,0,0);
    var out = [];
    var offsets = [];

    if(isSport(service)){
      var daysUntilSaturday = (6-anchor.getDay()+7)%7;
      for(var i=0;i<3;i++) offsets.push(daysUntilSaturday+(i*7));
    }else{
      offsets = [0,1,2];
    }

    offsets.forEach(function(offset){
      var d = new Date(anchor.getTime());
      d.setDate(anchor.getDate()+offset);
      var y = d.getFullYear();
      var m = String(d.getMonth()+1).padStart(2,"0");
      var day = String(d.getDate()).padStart(2,"0");
      out.push({
        key: y+"-"+m+"-"+day,
        number: d.getDate(),
        weekday: d.toLocaleDateString("es-CL",{weekday:"short",timeZone:"America/Santiago"})
      });
    });

    return out;
  }

  function getTimes(service){
    if(service==="gym") return ["09:00","10:00","11:00","12:00","15:00","16:00","17:00","18:00"];
    if(service==="nut") return ["09:30","10:30","11:30","14:30","15:30","16:30"];
    if(service==="psi") return ["09:00","10:00","11:00","12:00","15:00","16:00","17:00"];
    if(service==="football") return ["18:00"];
    if(service==="basketball") return ["15:00"];
    if(service==="volleyball") return ["13:00"];
    return [];
  }

  function chileNow(){
    var parts = new Intl.DateTimeFormat("en-CA",{
      timeZone:"America/Santiago",
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      hourCycle:"h23"
    }).formatToParts(new Date());

    var out={};
    parts.forEach(function(p){
      if(p.type!=="literal") out[p.type]=p.value;
    });

    return {
      dayKey: out.year+"-"+out.month+"-"+out.day,
      minutes: Number(out.hour)*60 + Number(out.minute)
    };
  }

  function isSlotAvailable(dayKey,time){
    var now = chileNow();
    if(dayKey > now.dayKey) return true;
    if(dayKey < now.dayKey) return false;

    var hm=time.split(":");
    var slotMinutes=Number(hm[0])*60+Number(hm[1]);
    return slotMinutes > now.minutes;
  }

  function isBookingWindowOpen(dayKey,time){
    var now = chileNow();
    if(dayKey > now.dayKey) return true;
    if(dayKey < now.dayKey) return false;

    var hm=String(time).slice(0,5).split(":");
    var slotMinutes=Number(hm[0])*60+Number(hm[1]);
    return (slotMinutes-now.minutes) > 30;
  }

  function availableTimesForDay(service,dayKey){
    return getTimes(service).filter(function(t){
      if(!isBookingWindowOpen(dayKey,t)) return false;
      if(service==="nut" || service==="psi"){
        var proMap=state.professionalAvailability[service+"|"+dayKey];
        if(proMap && (!proMap[t] || proMap[t].count<=0)) return false;
      }
      return true;
    });
  }

          '<b>'+serviceIcon(b.service)+' Inscripción al partido confirmada</b>'+
          '<p>Tu cupo quedó reservado para las <strong>'+esc(b.time||sportTime(b.service))+' hrs</strong>.</p>'+
          '<p>Lugar: <strong>'+esc(b.location||b.assignedPlace||"Cancha deportiva")+'</strong>.</p>'+
          '<p class="small">Capacidad máxima: '+sportCapacity(b.service)+' jugadores.</p>'+
        '</div>';
    }

    app.innerHTML = header()+
      '<main class="done">'+
        '<div class="tick">✓</div>'+
        '<h1>¡Hora agendada!</h1>'+
        '<p class="sub">Tu reserva con '+esc(s.title.toLowerCase())+' quedó registrada.</p>'+
        '<div class="summary">'+
          '<div class="summaryRow"><span>Servicio</span><b>'+esc(s.title)+'</b></div>'+
          '<div class="summaryRow"><span>Fecha</span><b>'+esc(b.day)+'</b></div>'+
          '<div class="summaryRow"><span>Hora</span><b>'+esc(b.time)+'</b></div>'+roomRow+
          '<div class="summaryRow"><span>Código</span><b>'+esc(b.id)+'</b></div>'+
        '</div>'+
        extra+
        '<div class="cancelHint" style="text-align:left;margin-top:16px"><b>¿Quieres cancelar esta hora?</b><br>Ve al apartado <strong>Historial</strong>, donde podrás revisar y cancelar tus reservas.</div>'+
        '<button class="miniBtn" data-action="history" style="width:100%;margin:0 0 10px">Ir a Historial</button>'+
        '<button class="btn" data-action="home">Volver al inicio</button>'+
        '<p class="small version">SPORTUV · versión interfaz v14.9</p>'+
      '</main>';
  }

  function serviceIcon(code){
    if(code==="gym") return "🏋️";
    if(code==="nut") return "🥗";
    if(code==="psi") return "🧠";
    if(code==="football") return "⚽";
    if(code==="basketball") return "🏀";
    if(code==="volleyball") return "🏐";
    return "📅";
  }

  async function loadGymRoomOccupancy(dayKey,time){
    if(!dayKey || !time) return;
    var key=dayKey+"|"+time;
    try{
      var rows=await rpc("sportuv_gym_room_occupancy",{p_booking_date:dayKey,p_booking_time:time});
      state.gymRoomOccupancy[key]=rows||[];
      if(state.view==="booking" && state.service==="gym" && state.day===dayKey && state.time===time) renderBooking();
    }catch(e){}
  }

  function serviceLabel(code){
    if(code==="gym") return "Gimnasio SPORTUV";
    if(code==="nut") return "Nutricionista";
    if(code==="psi") return "Psicólogo/a";
    if(code==="football") return "Partido de fútbol";
    if(code==="basketball") return "Partido de básquetbol";
    if(code==="volleyball") return "Partido de voleibol";
    return "Reserva";
  }

  function renderHistory(){
    var tab=state.historyTab||"upcoming";
    var body="";
    var tabs=
      '<div class="historyTabs">'+
        '<button class="historyTab '+(tab==="upcoming"?'active':'')+'" data-history-tab="upcoming">Próximas</button>'+
        '<button class="historyTab '+(tab==="past"?'active':'')+'" data-history-tab="past">Historial</button>'+
        '<button class="historyTab '+(tab==="waitlist"?'active':'')+'" data-history-tab="waitlist">Lista de espera</button>'+
      '</div>';

    if(state.historyLoading){
      body='<div class="panel">Cargando reservas…</div>';
    }else if(tab==="waitlist"){
      if(!state.waitlist.length){
        body='<div class="panel"><b>No estás en ninguna lista de espera.</b></div>';
      }else{
        state.waitlist.forEach(function(w){
          body+=
            '<div class="historyCard">'+
              '<div class="historyTop">'+
                '<div class="historyTitle"><span class="serviceIcon">🏋️</span><div><b>Gimnasio SPORTUV</b><div class="small">'+esc(w.booking_date)+' · '+esc(String(w.booking_time).slice(0,5))+'</div></div></div>'+
                '<span class="status active">En espera · #'+esc(w.queue_position)+'</span>'+
              '</div>'+
              '<p class="small">Si se libera un cupo, se asignará automáticamente siguiendo el orden de la lista.</p>'+
              '<button class="miniBtn danger" data-leave-waitlist="'+esc(w.id)+'">Salir de lista de espera</button>'+
            '</div>';
        });
      }
    }else{
      var filtered=state.history.filter(function(r){
        var cancelled=!!r.deleted_at;
        var future=isSlotAvailable(r.booking_date,String(r.booking_time).slice(0,5));
        return tab==="upcoming" ? (!cancelled && future) : (cancelled || !future);
      });

      if(!filtered.length){
        body='<div class="panel"><b>'+(tab==="upcoming"?'No tienes próximas reservas.':'Aún no tienes reservas anteriores o canceladas.')+'</b></div>';
      }else{
        filtered.forEach(function(r){
          var cancelled=!!r.deleted_at;
          var future=isSlotAvailable(r.booking_date,String(r.booking_time).slice(0,5));
          var canCancel=!cancelled && future && canCancelReservation(r.booking_date,r.booking_time);
          var tooLate=!cancelled && future && !canCancel;
          var statusText=cancelled ? 'Cancelada' : (future ? 'Confirmada' : 'Completada');
          var statusClass=cancelled ? 'cancelled' : 'active';
          body +=
            '<div class="historyCard">'+
              '<div class="historyTop">'+
                '<div class="historyTitle"><span class="serviceIcon">'+serviceIcon(r.service)+'</span><div><b>'+esc(serviceLabel(r.service))+'</b><div class="small">'+esc(r.booking_date)+' · '+esc(String(r.booking_time).slice(0,5))+'</div></div></div>'+
                '<span class="status '+statusClass+'">'+statusText+'</span>'+
              '</div>'+
              '<div class="small" style="margin-top:8px">'+
                (r.assigned_place ? 'Lugar: <b>'+esc(r.assigned_place)+'</b><br>' : '')+
                (r.professional ? 'Profesional: <b>'+esc(r.professional)+'</b><br>' : '')+
                'Código: <b>'+esc(r.booking_code)+'</b>'+
              '</div>'+
              (canCancel ? '<button class="miniBtn danger" style="margin-top:12px" data-cancel-code="'+esc(r.booking_code)+'">Cancelar reserva</button>' : '')+
              (tooLate ? '<div class="warning" style="margin:12px 0 0"><b>Cancelación cerrada</b>Falta menos de 1 hora. Debes contactar a SPORTUV.</div>' : '')+
            '</div>';
        });
      }
    }

    app.innerHTML = header()+
      '<main>'+
        '<h1>Mis reservas</h1>'+
        '<p class="sub">Consulta tus próximas horas, tu historial y tu lista de espera.</p>'+
        tabs+
        body+
      '</main>';
  }

  function render(){
    if(state.view==="login") return renderLogin();
    if(state.view==="home") return renderHome();
    if(state.view==="booking") return renderBooking();
    if(state.view==="done") return renderDone();
    if(state.view==="history") return renderHistory();
    if(state.view==="about") return renderAbout();
  }

  setInterval(function(){
    if(state.view==="booking" && state.day){
      if(state.time && !isBookingWindowOpen(state.day,state.time)){
        state.time = null;
      }
      if(state.service==="gym") loadGymAvailability(state.day);
      else if(state.service==="nut" || state.service==="psi") loadProfessionalAvailability(state.service,state.day);
      else if(isSport(state.service)){
        loadSportsAvailability(state.day);
        loadSportPlayers(state.service,state.day);
      }
      else renderBooking();
    }
  },30000);

  function submitLogin(){
    var fullName = (document.getElementById("fullName").value || "").trim();
    var email = (document.getElementById("email").value || "").trim().toLowerCase();
    var password = document.getElementById("password").value || "";
    if(fullName.length < 3 || !email.endsWith("@uv.cl") || password.length < 4){
      document.getElementById("loginError").innerHTML = '<div class="error">Ingresa tu nombre, un correo @uv.cl y una contraseña de al menos 4 caracteres.</div>';
      return;
    }
    state.name = fullName;
    state.user = email;
    save("sportuv_user_name",fullName);
    save("sportuv_user",email);
    state.view = "home";
    render();
  }

  async function confirmBooking(){
    if(!state.day || !state.time || !isBookingWindowOpen(state.day,state.time)){
      state.time = null;
      render();
      alert("Las reservas cierran 30 minutos antes. Ese horario ya no se puede agendar; selecciona el siguiente horario disponible.");
      return;
    }

    var b = {
      id: "SUV-"+String(Date.now()).slice(-6),
      name: state.name || "Sin nombre",
      email: state.user || "",
      service: state.service,
      day: state.day,
      time: state.time,
      createdAt: new Date().toISOString()
    };

    if(b.service==="nut" || b.service==="psi"){
      b.professional = null;
      b.location = null;
      b.assignedPlace = null;
    }

    var notificationPermissionPromise=requestNotificationPermission();
    var confirmBtn = document.getElementById("confirmBooking");
    if(confirmBtn){ confirmBtn.disabled = true; confirmBtn.textContent = "Guardando reserva..."; }

    try{
      var rows = await rpc("sportuv_create_reservation",{
        p_booking_code:b.id,
        p_person_name:b.name,
        p_email:b.email,
        p_service:b.service,
        p_assigned_place:b.assignedPlace||null,
        p_professional:b.professional||null,
        p_booking_date:b.day,
        p_booking_time:b.time,
        p_client_created_at:b.createdAt
      });

      var savedRow = rows && rows[0] ? rows[0] : null;
      if(!savedRow) throw new Error("No fue posible confirmar la reserva.");

      b.room = savedRow.room || null;
      b.assignedPlace = savedRow.assigned_place || b.assignedPlace || null;
      b.professional = savedRow.professional || b.professional || null;
      b.location = savedRow.assigned_place || b.location || null;
      if(b.service==="gym" && b.room) b.location = "Sala "+b.room;

      var stored = [];
      try{ stored = JSON.parse(load("sportuv_reservations") || "[]"); }catch(e){ stored = []; }
      if(!Array.isArray(stored)) stored = [];
      stored.unshift(b);
      save("sportuv_reservations", JSON.stringify(stored));

      state.gymAvailability={};
      state.professionalAvailability={};
      state.sportsAvailability={};
      state.booking = b;
      state.view = "done";
      render();
      await notificationPermissionPromise;
      sendReservationNotification(b);
    }catch(err){
      if(confirmBtn){ confirmBtn.disabled = false; confirmBtn.textContent = "Agendar"; }
      var msg=err.message||"";
      if(msg.indexOf("SAME_TIME_CONFLICT")!==-1 || msg.indexOf("SAME_TIME_WAITLIST_CONFLICT")!==-1){
        alert("Ya tienes otra reserva o lista de espera a esa misma hora. No puedes agendar dos actividades simultáneamente.");
      }else if(msg.indexOf("DUPLICATE_DAILY_BOOKING")!==-1){
        alert("Ya tienes una reserva de esta actividad para ese día. Solo puedes realizar una reserva diaria por actividad.");
      }else if(msg.indexOf("WAITLIST_DAILY_CONFLICT")!==-1){
        alert("Ya estás en una lista de espera del gimnasio para ese día.");
      }else if(msg.indexOf("GYM_SLOT_FULL")!==-1){
        state.gymAvailability={};
        if(state.day) loadGymAvailability(state.day);
        state.time=null;
        renderBooking();
        alert("Ese horario del gimnasio ya completó todos sus cupos. Selecciona otro horario.");
      }else if(msg.indexOf("SPORT_SLOT_FULL")!==-1){
        state.sportsAvailability={};
        if(state.day) loadSportsAvailability(state.day);
        state.time=null;
        renderBooking();
        alert("El partido ya completó todos sus cupos. Selecciona otro día.");
      }else if(msg.indexOf("SPORT_INVALID_DAY")!==-1){
        state.day=null;
        state.time=null;
        renderBooking();
        alert("Los partidos solo se pueden agendar los días sábado.");
      }else if(msg.indexOf("SPORT_INVALID_TIME")!==-1){
        state.time=null;
        renderBooking();
        alert("Ese horario no corresponde a la actividad seleccionada. Revisa el horario disponible del deporte.");
      }else if(msg.indexOf("PROFESSIONAL_SLOT_FULL")!==-1){
        state.professionalAvailability={};
        if(state.day) loadProfessionalAvailability(state.service,state.day);
        state.time=null;
        renderBooking();
        alert("Ya no quedan profesionales disponibles en ese horario. Selecciona otra hora.");
      }else if(msg.indexOf("SLOT_TOO_SOON")!==-1 || msg.indexOf("PAST_SLOT")!==-1){
        state.time=null;
        renderBooking();
        alert("Las reservas cierran 30 minutos antes. Selecciona el siguiente horario disponible.");
      }else if(msg.indexOf("BACKEND_STARTING")!==-1 || msg.indexOf("PGRST202")!==-1){
        alert("El sistema de reservas se está iniciando. Ya reintentamos la conexión automáticamente. Espera unos segundos y vuelve a presionar Agendar.");
      }else{
        alert("No se pudo guardar la reserva en el sistema central. Intenta nuevamente.\n\n"+msg);
      }
    }
  }

  document.addEventListener("submit",function(e){
    if(e.target && e.target.id==="loginForm"){
      e.preventDefault();
      submitLogin();
    }
  });

  document.addEventListener("click",function(e){
    var historyTab=e.target.closest("[data-history-tab]");
    if(historyTab){
      state.historyTab=historyTab.getAttribute("data-history-tab");
      renderHistory();
      return;
    }

    var waitBtn=e.target.closest("[data-wait-time]");
    if(waitBtn){
      joinWaitlist(state.day,waitBtn.getAttribute("data-wait-time"));
      return;
    }

    var leaveWaitBtn=e.target.closest("[data-leave-waitlist]");
    if(leaveWaitBtn){
      leaveWaitlist(leaveWaitBtn.getAttribute("data-leave-waitlist"));
      return;
    }

    var cancelBtn = e.target.closest("[data-cancel-code]");
    if(cancelBtn){
      cancelReservation(cancelBtn.getAttribute("data-cancel-code"));
      return;
    }

    var service = e.target.closest("[data-service]");
    if(service){
      state.service = service.getAttribute("data-service");
      state.day = null;
      state.time = null;
      state.view = "booking";
      render();
      return;
    }

    var day = e.target.closest("[data-day]");
    if(day){
      state.day = day.getAttribute("data-day");
      state.time = null;
      if(state.service==="gym") loadGymAvailability(state.day);
      if(state.service==="nut" || state.service==="psi") loadProfessionalAvailability(state.service,state.day);
      if(isSport(state.service)){
        loadSportsAvailability(state.day);
        loadSportPlayers(state.service,state.day);
      }
      render();
      return;
    }

    var time = e.target.closest("[data-time]");
    if(time){
      state.time = time.getAttribute("data-time");
      if(state.service==="gym") loadGymRoomOccupancy(state.day,state.time);
      render();
      return;
    }

    if(e.target.closest("#confirmBooking")){
      confirmBooking();
      return;
    }

    var action = e.target.closest("[data-action]");
    if(action){
      var a = action.getAttribute("data-action");
      if(a==="home"){
        state.view = "home";
        render();
      }
      if(a==="history"){
        state.historyTab="upcoming";
        state.view = "history";
        render();
        loadHistory();
      }
      if(a==="about"){
        state.view = "about";
        render();
      }
      if(a==="logout"){
        state.user = "";
        state.history=[];
        state.waitlist=[];
        state.view = "login";
        render();
      }
    }
  });

  state.user = load("sportuv_user");
  state.name = load("sportuv_user_name");
  render();
})();
</script>
</body>
</html>
